<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<script>(function(){try{var l=localStorage.getItem("appLanguage");if(l==="en"){document.documentElement.lang="en";document.documentElement.dir="ltr";}else if(l==="ar"){document.documentElement.lang="ar";document.documentElement.dir="rtl";}}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="staff.title">בית חם — בחירת איש צוות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f7d6e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
</head>
<body>
<div class="page">
  <header class="app-header">
    <div class="brand"><span class="logo">🏠</span> <span data-i18n="common.brand">בית חם</span></div>
    <nav>
      <a href="my-bookings.html" data-i18n="common.navMyBookings">ההזמנות שלי</a>
      <button class="btn btn-ghost" id="reset-btn" data-i18n="common.navReset">התחלה מחדש</button>
    </nav>
  </header>
  <main>
    <div class="steps">
      <div class="step active" data-i18n="staff.step1">1. בחירת צוות</div>
      <div class="step" data-i18n="staff.step2">2. הזמנה ופרטים</div>
    </div>
    <h1 id="page-title" data-i18n="staff.pageTitle">למי מאנשי הצוות תרצה/י לקבוע ביקור?</h1>
    <p class="subtitle" style="color:var(--text-muted); margin-bottom:8px;" data-i18n="staff.subtitle">בחר/י איש צוות פנוי לפי תפקיד וזמינות</p>
    <p id="role-filter-note" style="display:none; margin-bottom:20px;">
      <a href="staff.html" data-i18n="staff.showAllStaff">← הצגת כל אנשי הצוות</a>
    </p>
    <div class="error-msg" id="error-box" role="alert" aria-live="assertive"></div>
    <div id="staff-grid" class="grid"></div>
    <div id="empty-state" class="empty-state" style="display:none;" data-i18n="staff.emptyState">לא נמצאו אנשי צוות זמינים כרגע.</div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="i18n.js"></script>
<script>
  (async () => {
    applyTranslations();
    renderLangSwitch();

    const user = await ensureGuestSession();
    if (!user) return;
    wireReset();

    const grid = document.getElementById("staff-grid");
    const errorBox = document.getElementById("error-box");
    const params = new URLSearchParams(window.location.search);
    const roleFilter = params.get("role");

    if (roleFilter) {
      document.getElementById("page-title").textContent = tf("staff.roleFilterTitle", { role: roleLabel(roleFilter) });
      document.getElementById("role-filter-note").style.display = "block";
    }

    showLoadingRow(grid, t("staff.loadingStaff"));

    let staff, error;
    try {
      let query = supabaseClient.from("medical_staff").select("*").order("role");
      if (roleFilter) query = query.eq("role", roleFilter);
      ({ data: staff, error } = await query);
    } catch (err) {
      error = err;
    }

    grid.innerHTML = "";

    if (error) {
      showError(errorBox, t("staff.errLoadingStaff") + friendlyErrorMessageLocalized(error));
      return;
    }
    if (!staff || staff.length === 0) {
      document.getElementById("empty-state").style.display = "block";
      return;
    }

    staff.forEach((s) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "staff-card";
      card.innerHTML = `
        <span class="role-badge">${roleLabel(s.role)}</span>
        <div class="name">${escapeHtml(s.full_name)}</div>
        <div class="spec">${escapeHtml(s.specialization || "")}</div>
        <div class="avail">${formatAvailabilityLocalized(s)}</div>
      `;
      card.addEventListener("click", () => {
        sessionStorage.setItem("selected_staff", JSON.stringify(s));
        window.location.href = "booking.html";
      });
      grid.appendChild(card);
    });
  })();
</script>
</body>
</html>
