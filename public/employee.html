<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>בית חם — כניסת צוות רפואי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f7d6e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
</head>
<body>

<div id="staff-app" class="page" style="display:none;">
  <header class="app-header">
    <div class="brand"><span class="logo">🩺</span> <span id="staff-app-title">צוות רפואי</span></div>
    <nav>
      <button class="btn btn-ghost" id="staff-change-password-btn">שינוי סיסמה</button>
      <button class="btn btn-ghost" id="staff-logout-btn">התנתקות</button>
    </nav>
  </header>
  <main style="max-width:1100px;">
    <div class="error-msg" id="app-error" role="alert" aria-live="assertive"></div>
    <div class="success-msg" id="app-success" role="status" aria-live="polite"></div>

    <div id="change-password-box" class="card" style="display:none; padding:16px; margin-bottom:16px; max-width:360px;">
      <div class="field">
        <label for="staff-new-password">סיסמה חדשה</label>
        <input type="password" id="staff-new-password" autocomplete="new-password" minlength="6">
      </div>
      <div class="error-msg" id="change-password-error" role="alert" aria-live="assertive"></div>
      <div class="actions-row" style="justify-content:flex-start;">
        <button class="btn btn-ghost btn-sm" id="change-password-cancel">ביטול</button>
        <button class="btn btn-primary btn-sm" id="change-password-save">שמירה</button>
      </div>
    </div>

    <section id="my-work-section">
      <h2>העבודה שלי</h2>
      <div id="my-work"><p style="color:var(--text-muted);">טוען...</p></div>
    </section>

    <section id="patient-record-section">
      <h2>המטופלים שלי</h2>
      <div class="field" style="max-width:420px;">
        <label for="patient-search-input">חיפוש (שם / ת.ז. / טלפון)</label>
        <input type="text" id="patient-search-input" placeholder="לדוגמה: ישראל ישראלי" autocomplete="off">
      </div>
      <div id="patient-search-results"></div>

      <div id="pr-record" style="display:none; margin-top:20px;">
        <div id="pr-allergy-banner" style="display:none;"></div>
        <div id="pr-header" class="pr-header-card"></div>
        <div class="pr-tabs" id="pr-tabs"></div>
        <div id="pr-tab-content" class="pr-tab-content"></div>
      </div>
    </section>
  </main>
</div>

<!-- Visit report modal (perform + document a visit) -->
<div id="visit-report-modal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="visit-report-modal-title">
  <div class="modal-card card" style="max-width:640px;">
    <h2 id="visit-report-modal-title">דוח ביקור בית</h2>
    <input type="hidden" id="vr-booking-id">
    <div class="field">
      <div id="vr-context" style="color:var(--text-muted); font-size:15px;"></div>
    </div>

    <h3>מדדים רפואיים</h3>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0 16px;">
      <div class="field"><label for="vr-systolic">ל"ד סיסטולי</label><input type="number" id="vr-systolic" placeholder="120"></div>
      <div class="field"><label for="vr-diastolic">ל"ד דיאסטולי</label><input type="number" id="vr-diastolic" placeholder="80"></div>
      <div class="field"><label for="vr-sugar">סוכר (mg/dL)</label><input type="number" id="vr-sugar" placeholder="100"></div>
      <div class="field"><label for="vr-pulse">דופק (BPM)</label><input type="number" id="vr-pulse" placeholder="72"></div>
      <div class="field"><label for="vr-temp">חום גוף (°C)</label><input type="number" step="0.1" id="vr-temp" placeholder="36.6"></div>
      <div class="field"><label for="vr-o2">סטורציה (%)</label><input type="number" id="vr-o2" placeholder="98"></div>
    </div>
    <div id="vr-risk-panel"></div>

    <h3>פרוצדורות שבוצעו</h3>
    <div id="vr-procedures" class="field"></div>

    <div class="field">
      <label for="vr-summary">סיכום טיפול והנחיות המשך</label>
      <textarea id="vr-summary" rows="4" placeholder="פרוט מהלך הביקור, מצב הפצע, או דגשים מיוחדים למשפחה..."></textarea>
    </div>

    <div class="field">
      <label>חתימת מטופל</label>
      <canvas id="vr-signature-canvas" class="signature-canvas" width="500" height="150"></canvas>
      <button type="button" class="btn btn-ghost btn-sm" id="vr-signature-clear" style="margin-top:8px;">ניקוי חתימה</button>
    </div>

    <div class="field">
      <label><input type="checkbox" id="vr-mark-completed" checked style="width:auto; display:inline-block;"> לסמן את הביקור כהושלם עם השמירה</label>
    </div>

    <div class="error-msg" id="visit-report-modal-error" role="alert" aria-live="assertive"></div>
    <div class="actions-row">
      <button class="btn btn-ghost" id="visit-report-modal-cancel">ביטול</button>
      <button class="btn btn-primary" id="visit-report-modal-save">שמירה</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  // PREDICTIVE_SERVICE_URL מוגדר ב-config.js (מקור יחיד, לא כפול בין admin/employee).
  initPredictiveServiceHealthCheck();
  const staffApp = document.getElementById("staff-app");
  const appError = document.getElementById("app-error");
  const appSuccess = document.getElementById("app-success");
  let myStaffRow = null;

  function flashSuccess(msg) {
    appSuccess.textContent = msg;
    appSuccess.classList.add("show");
    setTimeout(() => appSuccess.classList.remove("show"), 2500);
  }
  function flashError(msg) {
    appError.textContent = msg;
    appError.classList.add("show");
    setTimeout(() => appError.classList.remove("show"), 4000);
  }

  // הרשאה: לא is_admin — קיום שורת medical_staff פעילה עם auth_user_id = המשתמש
  // המחובר. נבדק כאן שוב בצד לקוח (לא רק ב-employee-login.html) כדי שרענון ישיר של
  // employee.html, או session ישן שנשאר פתוח אחרי שהמנהל השבית את החשבון, לא ייתן
  // גישה — ה-RLS עצמו (current_staff_id עם is_active) כבר חוסם את הנתונים בכל מקרה,
  // זו רק שכבת הגנה נוספת שמונעת אפילו הצגת מסך ריק/שגוי.
  async function resolveActiveStaffSession() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return null;
    const { data, error } = await supabaseClient
      .from("medical_staff")
      .select("id, full_name, role, is_active")
      .eq("auth_user_id", session.user.id)
      .maybeSingle();
    if (error || !data || !data.is_active) return null;
    return data;
  }

  document.getElementById("staff-logout-btn").addEventListener("click", async () => {
    await supabaseClient.auth.signOut();
    window.location.href = "employee-login.html";
  });

  document.getElementById("staff-change-password-btn").addEventListener("click", () => {
    const box = document.getElementById("change-password-box");
    box.style.display = box.style.display === "none" ? "block" : "none";
    hideError(document.getElementById("change-password-error"));
    document.getElementById("staff-new-password").value = "";
  });
  document.getElementById("change-password-cancel").addEventListener("click", () => {
    document.getElementById("change-password-box").style.display = "none";
  });
  document.getElementById("change-password-save").addEventListener("click", async () => {
    const errEl = document.getElementById("change-password-error");
    hideError(errEl);
    const newPassword = document.getElementById("staff-new-password").value;
    if (!newPassword || newPassword.length < 6) { showError(errEl, "הסיסמה חייבת להכיל לפחות 6 תווים"); return; }
    const btn = document.getElementById("change-password-save");
    setButtonLoading(btn, true, "שומר...");
    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
    setButtonLoading(btn, false);
    if (error) { showError(errEl, friendlyErrorMessage(error)); return; }
    document.getElementById("change-password-box").style.display = "none";
    flashSuccess("הסיסמה עודכנה בהצלחה");
  });

  async function showStaffApp() {
    staffApp.style.display = "flex";
    document.getElementById("staff-app-title").textContent = `${myStaffRow.full_name} · ${ROLE_LABELS[myStaffRow.role] || myStaffRow.role}`;
    await loadMyBookings();
  }

  // ===== העבודה שלי =====
  // RLS (staff_select_assigned_bookings / staff_select_assigned_tasks / staff_select_assigned_alerts,
  // דרך is_my_patient) כבר מגביל הכל אוטומטית לצוות הזה — אין צורך לסנן staff_id= בצד לקוח.
  // תצוגה ממוקדת-משימה במקום טבלה שטוחה של כל הביקורים אי-פעם: הבא / היום / בתהליך /
  // מעקבים פתוחים / התראות, ורק בסוף רשימה מתקפלת (סגורה כברירת מחדל) של ההיסטוריה המלאה.
  function startOfToday() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function endOfToday() { const d = new Date(); d.setHours(23, 59, 59, 999); return d; }

  function myWorkBookingRowHtml(b, riskByPatient) {
    const date = new Date(b.scheduled_at);
    const report = (b.visit_reports && b.visit_reports[0]) || null;
    return `
      <div class="pr-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div>
          <strong>${escapeHtml(b.patients?.full_name || "—")}</strong>
          <span style="color:var(--text-muted); font-size:13px;"> · ${escapeHtml(b.patients?.phone || "")}</span>
          <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">
            ${PURPOSE_LABELS[b.visit_purpose] || b.visit_purpose} · ${formatDateHe(date)} ${formatTimeHe(date)}
            ${riskBadgeHtml(riskByPatient.get(b.patient_id))}
          </div>
        </div>
        <div class="actions-row" data-booking-id="${b.id}" style="margin:0;"></div>
      </div>
    `;
  }

  function bindMyWorkBookingActions(container, bookingsById) {
    container.querySelectorAll(".actions-row[data-booking-id]").forEach((row) => {
      const b = bookingsById.get(Number(row.dataset.bookingId));
      if (!b) return;
      if (b.status === "scheduled") {
        const startBtn = document.createElement("button");
        startBtn.className = "btn btn-primary btn-sm";
        startBtn.textContent = b.workflow_status === "in_progress" ? "המשך ביקור" : "התחלת ביקור";
        startBtn.addEventListener("click", () => startMyVisit(b));
        row.appendChild(startBtn);
      } else if (b.status !== "cancelled") {
        const report = (b.visit_reports && b.visit_reports[0]) || null;
        const reportBtn = document.createElement("button");
        reportBtn.className = "btn btn-secondary btn-sm";
        reportBtn.textContent = report ? "עריכת דוח" : "דוח ביקור";
        reportBtn.addEventListener("click", () => openVisitReportModal(b, report));
        row.appendChild(reportBtn);
      }
      const openRecordBtn = document.createElement("button");
      openRecordBtn.className = "btn btn-secondary btn-sm";
      openRecordBtn.textContent = "פתיחת תיק מטופל";
      openRecordBtn.addEventListener("click", () => openPatientRecord(b.patient_id));
      row.appendChild(openRecordBtn);
    });
  }

  async function startMyVisit(b) {
    if (b.workflow_status !== "in_progress") {
      const { error } = await supabaseClient.from("bookings").update({ workflow_status: "in_progress" }).eq("id", b.id);
      if (error) { showError(appError, friendlyErrorMessage(error)); return; }
      b.workflow_status = "in_progress";
    }
    const report = (b.visit_reports && b.visit_reports[0]) || null;
    openVisitReportModal(b, report);
  }

  async function loadMyBookings() {
    const container = document.getElementById("my-work");
    container.innerHTML = `<div class="loading-row"><span class="spinner spinner-dark"></span><span>טוען...</span></div>`;
    let bookings, bookingsError, risks, tasks, alerts;
    try {
      ({ data: bookings, error: bookingsError } = await supabaseClient
        .from("bookings")
        .select("*, patients(id, full_name, phone), visit_reports(*)")
        .order("scheduled_at", { ascending: true }));
      ({ data: risks } = await supabaseClient.from("current_patient_risk").select("*"));
      ({ data: tasks } = await supabaseClient.from("tasks").select("*, patients(full_name)").eq("status", "pending").order("due_at", { ascending: true }));
      ({ data: alerts } = await supabaseClient.from("alerts").select("*, patients(full_name)").eq("status", "open").order("severity", { ascending: false }));
    } catch (err) {
      bookingsError = err;
    }
    if (bookingsError) {
      container.innerHTML = `<p style="color:var(--danger);">${friendlyErrorMessage(bookingsError)}</p>`;
      return;
    }
    bookings = bookings || [];
    const riskByPatient = new Map((risks || []).map((r) => [r.patient_id, r]));
    const bookingsById = new Map(bookings.map((b) => [b.id, b]));

    const now = new Date();
    const todayStart = startOfToday(), todayEnd = endOfToday();
    const scheduled = bookings.filter((b) => b.status === "scheduled");
    const nextVisit = scheduled.filter((b) => new Date(b.scheduled_at) >= now).sort((a, c) => new Date(a.scheduled_at) - new Date(c.scheduled_at))[0] || null;
    const todaysVisits = scheduled.filter((b) => { const d = new Date(b.scheduled_at); return d >= todayStart && d <= todayEnd && (!nextVisit || b.id !== nextVisit.id); });
    const inProgress = scheduled.filter((b) => b.workflow_status === "in_progress" && (!nextVisit || b.id !== nextVisit.id) && !todaysVisits.some((t) => t.id === b.id));
    const historical = [...bookings].sort((a, c) => new Date(c.scheduled_at) - new Date(a.scheduled_at));

    let html = "";

    html += `<h3 style="margin:16px 0 8px;">הביקור הבא</h3>`;
    html += nextVisit ? myWorkBookingRowHtml(nextVisit, riskByPatient) : `<p class="empty-state">אין ביקור מתוכנן</p>`;

    if (inProgress.length) {
      html += `<h3 style="margin:20px 0 8px;">🩺 בתהליך</h3>`;
      html += inProgress.map((b) => myWorkBookingRowHtml(b, riskByPatient)).join("");
    }

    html += `<h3 style="margin:20px 0 8px;">ביקורי היום</h3>`;
    html += todaysVisits.length
      ? todaysVisits.map((b) => myWorkBookingRowHtml(b, riskByPatient)).join("")
      : `<p class="empty-state">אין עוד ביקורים היום</p>`;

    if ((tasks || []).length) {
      html += `<h3 style="margin:20px 0 8px;">🔔 מעקבים פתוחים</h3>`;
      html += tasks.map((t) => `
        <div class="pr-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div><strong>${escapeHtml(t.patients?.full_name || "—")}</strong><div style="font-size:13px; color:var(--text-muted);">${escapeHtml(t.title)} · עד ${formatDateHe(new Date(t.due_at))}</div></div>
          <button class="btn btn-secondary btn-sm my-work-open-patient" data-patient-id="${t.patient_id}">פתיחת תיק</button>
        </div>
      `).join("");
    }

    if ((alerts || []).length) {
      html += `<h3 style="margin:20px 0 8px;">⚠️ התראות קליניות חשובות</h3>`;
      html += alerts.map((a) => `
        <div class="pr-card" style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div><strong>${escapeHtml(a.patients?.full_name || "—")}</strong><div style="font-size:13px; color:var(--text-muted);">${escapeHtml(a.message)}</div></div>
          <button class="btn btn-secondary btn-sm my-work-open-patient" data-patient-id="${a.patient_id}">פתיחת תיק</button>
        </div>
      `).join("");
    }

    html += `
      <details class="queue-group" style="margin-top:20px;">
        <summary>כל הביקורים שלי <span class="queue-count">${historical.length}</span></summary>
        <div id="my-work-history"></div>
      </details>
    `;

    container.innerHTML = html;
    bindMyWorkBookingActions(container, bookingsById);
    container.querySelectorAll(".my-work-open-patient").forEach((btn) => {
      btn.addEventListener("click", () => openPatientRecord(btn.dataset.patientId));
    });
    const historyEl = document.getElementById("my-work-history");
    if (historical.length) {
      historyEl.innerHTML = historical.map((b) => myWorkBookingRowHtml(b, riskByPatient)).join("");
      bindMyWorkBookingActions(historyEl, bookingsById);
    } else {
      historyEl.innerHTML = `<p class="empty-state">אין ביקורים משויכים אליך</p>`;
    }
  }

  // ===== דוח ביקור (זהה במבנה לזה שבפאנל הניהול, מותאם לצוות) =====
  const vrProceduresEl = document.getElementById("vr-procedures");
  PROCEDURE_META.forEach((p) => {
    const label = document.createElement("label");
    label.style.display = "block";
    label.innerHTML = `<input type="checkbox" data-proc="${p.key}" style="width:auto; display:inline-block;"> ${p.label}`;
    vrProceduresEl.appendChild(label);
  });

  const visitReportModal = document.getElementById("visit-report-modal");
  const vrCanvas = document.getElementById("vr-signature-canvas");
  const vrCtx = vrCanvas.getContext("2d");
  let vrDrawing = false;
  let vrHasSignature = false;

  function vrCanvasPoint(e) {
    const rect = vrCanvas.getBoundingClientRect();
    const scaleX = vrCanvas.width / rect.width;
    const scaleY = vrCanvas.height / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return { x: (point.clientX - rect.left) * scaleX, y: (point.clientY - rect.top) * scaleY };
  }
  function vrClearCanvas() {
    vrCtx.clearRect(0, 0, vrCanvas.width, vrCanvas.height);
    vrHasSignature = false;
  }
  ["mousedown", "touchstart"].forEach((evt) => vrCanvas.addEventListener(evt, (e) => {
    e.preventDefault();
    vrDrawing = true;
    const { x, y } = vrCanvasPoint(e);
    vrCtx.beginPath();
    vrCtx.moveTo(x, y);
  }));
  ["mousemove", "touchmove"].forEach((evt) => vrCanvas.addEventListener(evt, (e) => {
    if (!vrDrawing) return;
    e.preventDefault();
    const { x, y } = vrCanvasPoint(e);
    vrCtx.lineTo(x, y);
    vrCtx.stroke();
    vrHasSignature = true;
  }));
  ["mouseup", "mouseleave", "touchend"].forEach((evt) => vrCanvas.addEventListener(evt, () => { vrDrawing = false; }));
  document.getElementById("vr-signature-clear").addEventListener("click", vrClearCanvas);

  function vrLoadSignature(dataUrl) {
    vrClearCanvas();
    if (!dataUrl) return;
    const img = new Image();
    img.onload = () => vrCtx.drawImage(img, 0, 0, vrCanvas.width, vrCanvas.height);
    img.src = dataUrl;
    vrHasSignature = true;
  }

  function openVisitReportModal(booking, report) {
    document.getElementById("visit-report-modal-title").textContent = report ? "עריכת דוח ביקור" : "הוספת דוח ביקור";
    document.getElementById("vr-booking-id").value = booking.id;
    visitReportModal.dataset.patientId = booking.patient_id;
    visitReportModal.dataset.staffId = myStaffRow.id;
    const date = new Date(booking.scheduled_at);
    document.getElementById("vr-context").textContent =
      `${booking.patients?.full_name || "—"} · ${formatDateHe(date)} ${formatTimeHe(date)}`;
    document.getElementById("vr-systolic").value = report?.systolic_bp ?? "";
    document.getElementById("vr-diastolic").value = report?.diastolic_bp ?? "";
    document.getElementById("vr-sugar").value = report?.blood_sugar ?? "";
    document.getElementById("vr-pulse").value = report?.pulse ?? "";
    document.getElementById("vr-temp").value = report?.temperature ?? "";
    document.getElementById("vr-o2").value = report?.oxygen_saturation ?? "";
    document.getElementById("vr-summary").value = report?.treatment_summary ?? "";
    vrProceduresEl.querySelectorAll("input[type=checkbox]").forEach((cb) => {
      cb.checked = report ? !!report[cb.dataset.proc] : false;
    });
    vrLoadSignature(report?.patient_signature_data || null);
    document.getElementById("vr-mark-completed").checked = booking.status !== "completed";
    hideError(document.getElementById("visit-report-modal-error"));
    visitReportModal.style.display = "flex";
    loadAndRenderRisk(booking.patient_id);
    loadPatientContextForRisk(booking.patient_id);
  }

  // רקע רפואי (background_conditions/smoking_status) לחישוב הסיכון — ר' הערה מקבילה
  // ב-admin.html ובpredictive-service/main.py compute_risk().
  let vrPatientContext = null;
  async function loadPatientContextForRisk(patientId) {
    vrPatientContext = null;
    const { data, error } = await supabaseClient.from("patients").select("background_conditions, smoking_status").eq("id", patientId).maybeSingle();
    if (error) { console.error("patient context for risk", error); vrPatientContext = { background_conditions: [], smoking_status: null }; return; }
    vrPatientContext = { background_conditions: data?.background_conditions || [], smoking_status: data?.smoking_status || null };
  }

  async function loadCurrentRiskForPatient(patientId) {
    const { data, error } = await supabaseClient
      .from("current_patient_risk")
      .select("*")
      .eq("patient_id", patientId)
      .maybeSingle();
    if (error) { console.error("current_patient_risk", error); return null; }
    return data;
  }

  function renderRiskPanel(currentRisk) {
    const panel = document.getElementById("vr-risk-panel");
    if (!currentRisk) {
      panel.innerHTML = `<div class="risk-badge risk-badge-muted">לא נבדק</div><p style="color:var(--text-muted); font-size:13px; margin:6px 0 0;">${RISK_DISCLAIMER}</p>`;
      return;
    }
    const trendMeta = currentRisk.trend ? TREND_META[currentRisk.trend] : null;
    const statusClass = `caregiver-status-${currentRisk.risk_level in CAREGIVER_STATUS_BY_LEVEL ? currentRisk.risk_level : "no_data"}`;
    panel.innerHTML = `

  function collectVitalsFromForm() {
    const num = (id) => {

      return v === "" ? null : Number(v);
    };
    return {
      systolic_bp: num("vr-systolic"), diastolic_bp: num("vr-diastolic"), blood_sugar: num("vr-sugar"),
      pulse: num("vr-pulse"), temperature: num("vr-temp"), oxygen_saturation: num("vr-o2"),

  function predictiveServiceUnavailableMessage(err) {
    return /failed to fetch|network|load failed/i.test(err?.message || "")
      ? "שירות התחזית לא זמין. יש להריץ אותו מקומית (predictive-service) על פורט 8000."
      : friendlyErrorMessage(err);
  }

  async function maybeCreateAlert(patientId, riskLevel, trend, statusMessage, riskPredictionId) {
    let evaluation;
    try {
      const res = await fetch(`${PREDICTIVE_SERVICE_URL}/alerts/evaluate`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ risk_level: riskLevel, trend, status_message: statusMessage, trigger_events: [] }),
      });
      if (!res.ok) return;
      evaluation = await res.json();
    } catch (err) { return; }
    if (!evaluation.alert_type) return;
    const { data: existing } = await supabaseClient.from("alerts").select("id").eq("patient_id", patientId).eq("alert_type", evaluation.alert_type).eq("status", "open").limit(1);
    if (existing && existing.length) return;
    await supabaseClient.from("alerts").insert({
      patient_id: patientId, risk_prediction_id: riskPredictionId,
      alert_type: evaluation.alert_type, severity: evaluation.severity, message: evaluation.message,
    });
    prInvalidate("alerts");
  }

  async function recalculateRiskAfterSave(patientId, savedReportId, currentVitals) {
    const { data: prevReports } = await supabaseClient
      .from("visit_reports")
      .select("systolic_bp, diastolic_bp, blood_sugar, pulse, temperature, oxygen_saturation")
      .eq("patient_id", patientId).neq("id", savedReportId)
      .order("visit_date", { ascending: false }).limit(1);
    const previous = prevReports && prevReports[0] ? prevReports[0] : null;

    let assessment;
    try {
      const res = await fetch(`${PREDICTIVE_SERVICE_URL}/predict/risk-assessment`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ current: currentVitals, previous, prediction_horizon_hours: 8, patient_context: vrPatientContext }),
      });
      if (!res.ok) throw new Error(`שירות התחזית החזיר שגיאה (${res.status})`);
      assessment = await res.json();
    } catch (err) {
      document.getElementById("vr-risk-panel").innerHTML = `<p style="color:var(--danger);">${predictiveServiceUnavailableMessage(err)}</p>`;
      return;
    }
    if (assessment.risk_level === "no_data") { renderRiskPanel(null); return; }

    const { data: { session } } = await supabaseClient.auth.getSession();
    const predictedAt = new Date();
    const expiresAt = new Date(predictedAt.getTime() + assessment.prediction_horizon_hours * 3600 * 1000);
    const { data: insertedRisk, error: insertError } = await supabaseClient.from("risk_predictions").insert({
      patient_id: patientId, visit_report_id: savedReportId, predicted_at: predictedAt.toISOString(),
      input_features: currentVitals, risk_level: assessment.risk_level, confidence: assessment.confidence,
      prediction_horizon_hours: assessment.prediction_horizon_hours, expires_at: expiresAt.toISOString(),
      model_version: assessment.model_version, trend: assessment.trend, probability: assessment.probability,
      created_by: session?.user?.id || null,
    }).select("id").single();
    if (insertError) console.error("risk_predictions insert", insertError);
    else maybeCreateAlert(patientId, assessment.risk_level, assessment.trend, assessment.status_message, insertedRisk?.id);

    renderRiskPanel({ risk_level: assessment.risk_level, trend: assessment.trend, predicted_at: predictedAt.toISOString(), expires_at: expiresAt.toISOString(), prediction_horizon_hours: assessment.prediction_horizon_hours });
  }

  document.getElementById("visit-report-modal-save").addEventListener("click", async () => {
    const modalError = document.getElementById("visit-report-modal-error");
    hideError(modalError);
    const vitals = collectVitalsFromForm();
    const summary = document.getElementById("vr-summary").value.trim();

    if (vitals.systolic_bp !== null && (vitals.systolic_bp < 50 || vitals.systolic_bp > 250)) { showError(modalError, 'ל"ד סיסטולי תקין נע בין 50 ל-250'); return; }
    if (vitals.diastolic_bp !== null && (vitals.diastolic_bp < 30 || vitals.diastolic_bp > 150)) { showError(modalError, 'ל"ד דיאסטולי תקין נע בין 30 ל-150'); return; }
    if (vitals.blood_sugar !== null && (vitals.blood_sugar < 20 || vitals.blood_sugar > 600)) { showError(modalError, "רמת סוכר תקינה נעה בין 20 ל-600"); return; }
    if (vitals.pulse !== null && (vitals.pulse < 30 || vitals.pulse > 220)) { showError(modalError, "דופק תקין נע בין 30 ל-220"); return; }
    if (vitals.temperature !== null && (vitals.temperature < 30 || vitals.temperature > 45)) { showError(modalError, "חום גוף תקין נע בין 30 ל-45"); return; }
    if (vitals.oxygen_saturation !== null && (vitals.oxygen_saturation < 50 || vitals.oxygen_saturation > 100)) { showError(modalError, "סטורציה נעה בין 50 ל-100"); return; }
    if (!summary) { showError(modalError, "חובה למלא סיכום טיפול"); return; }

    const payload = {
      booking_id: Number(document.getElementById("vr-booking-id").value),
      patient_id: visitReportModal.dataset.patientId,
      staff_id: Number(visitReportModal.dataset.staffId),
      ...vitals,
      treatment_summary: summary,
      patient_signature_data: vrHasSignature ? vrCanvas.toDataURL("image/png") : null,
    };
    PROCEDURE_META.forEach((p) => {
      payload[p.key] = vrProceduresEl.querySelector(`input[data-proc="${p.key}"]`).checked;
    });

    const markCompleted = document.getElementById("vr-mark-completed").checked;
    const btn = document.getElementById("visit-report-modal-save");
    setButtonLoading(btn, true, "שומר...");
    let error, savedReport;
    try {
      ({ data: savedReport, error } = await supabaseClient.from("visit_reports").upsert(payload, { onConflict: "booking_id" }).select("id").single());
    } catch (err) {
      error = err;
    } finally {
      setButtonLoading(btn, false);
    }
    if (error) {
      if (isNetworkError(error)) {
        queueVisitReportDraft({ ...payload, _markCompleted: markCompleted });
        visitReportModal.style.display = "none";
        flashSuccess("אין חיבור לאינטרנט — הדוח נשמר מקומית במכשיר ויסונכרן אוטומטית ברגע שהחיבור יחזור");
        loadMyBookings();
        return;
      }
      showError(modalError, friendlyErrorMessage(error));
      return;
    }

    let statusError = null;
    if (markCompleted) {
      ({ error: statusError } = await supabaseClient.from("bookings").update({ status: "completed" }).eq("id", payload.booking_id));
      if (statusError) console.error("bookings status update", statusError);
    }

    visitReportModal.style.display = "none";
    flashSuccess(markCompleted && !statusError ? "דוח הביקור נשמר וסומן כהושלם" : "דוח הביקור נשמר");
    loadMyBookings();
    await recalculateRiskAfterSave(payload.patient_id, savedReport.id, vitals);
    refreshOpenPatientRecordIfMatching(payload.patient_id);
  });

    const { data, error } = await supabaseClient
      .from("patients")
      .select("id, full_name, phone, national_id")
      .or(`full_name.ilike.%${q}%,phone.ilike.%${q}%,national_id.ilike.%${q}%`)
      .limit(10);

  async function prRenderOverviewTab(content) {
    const state = window.currentPatientState;
    const [currentRisk, bookings, alerts, tasks, visits] = await Promise.all([
      prCached("currentRisk", () => loadCurrentRiskForPatient(state.patientId)),
      prCached("bookings", prFetchBookings), prCached("alerts", prFetchAlerts),
      prCached("tasks", prFetchTasks), prCached("visitReports", prFetchVisitReports),
    ]);
    const now = new Date();
    const upcoming = bookings.filter((b) => b.status === "scheduled" && new Date(b.scheduled_at) >= now).sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
    const past = bookings.filter((b) => new Date(b.scheduled_at) < now).sort((a, b) => new Date(b.scheduled_at) - new Date(a.scheduled_at));
    const openAlerts = alerts.filter((a) => a.status === "open");
    const openTasks = tasks.filter((t) => t.status === "pending").sort((a, b) => new Date(a.due_at) - new Date(b.due_at));
    const latestVisit = visits[0];
    const riskStatusClass = currentRisk ? `caregiver-status-${currentRisk.risk_level in CAREGIVER_STATUS_BY_LEVEL ? currentRisk.risk_level : "no_data"}` : "";
    const riskCardTone = currentRisk?.risk_level === "red" ? "border: 1.5px solid var(--danger);" : "";

    if (latestVisit) {

      html += `<div style="color:var(--text-muted); font-size:12px; margin-bottom:6px;">${formatDateHe(new Date(latestVisit.visit_date))} ${formatTimeHe(new Date(latestVisit.visit_date))}</div>`;
      html += vitalsSummary.length
        ? `<div style="display:flex; flex-wrap:wrap; gap:14px;">${vitalsSummary.map((v) => `<div><div style="font-size:12px; color:var(--text-muted);">${v.label}</div><div style="font-weight:700;">${latestVisit[v.key]}${v.unit}</div></div>`).join("")}</div>`
        : `<span style="color:var(--text-muted);">לא נמדדו מדדים בביקור האחרון</span>`;
    } else {
      html += `<span style="color:var(--text-muted);">אין עדיין מדידות</span>`;
    }
    html += `</div>`;

    html += `
      <div class="pr-card" style="${riskCardTone}">
        <h3 style="margin-top:0;">רמת סיכון נוכחית</h3>
        ${currentRisk
          ? `<div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">${riskBadgeHtml(currentRisk)}<strong class="${riskStatusClass}" style="font-size:15px;">${escapeHtml(caregiverStatusMessage(currentRisk.risk_level, currentRisk.trend))}</strong></div>`
          : `<span style="color:var(--text-muted);">אין הערכת סיכון עדכנית</span>`}
        <p style="color:var(--text-muted); font-size:12px; margin:8px 0 0;">${RISK_DISCLAIMER}</p>
      </div>
    `;

    html += `<div class="pr-card"><h3 style="margin-top:0;">פעולות נדרשות</h3>`;
    if (!openAlerts.length && !openTasks.length) {
      html += `<span style="color:var(--text-muted);">אין פעולות פתוחות כרגע</span>`;
    } else {
      openAlerts.forEach((a) => { html += `<div style="margin-bottom:4px;"><span class="pr-badge pr-badge-${a.severity}">${ALERT_TYPE_LABELS[a.alert_type] || a.alert_type}</span> ${escapeHtml(a.message)}</div>`; });

  // עדכון דוח של איש צוות אחר ייכשל בשקט RLS-wise ויוצג כשגיאה ידידותית.
  const CLINICAL_OUTCOME_OPTIONS = [

  function clinicalOutcomeSelectHtml(v) {
    const options = CLINICAL_OUTCOME_OPTIONS.map(
      (o) => `<option value="${o.value}" ${(v.clinical_outcome_8h || "") === o.value ? "selected" : ""}>${o.label}</option>`
    ).join("");
    return `

  function bindClinicalOutcomeSelects(content, visits) {
    content.querySelectorAll(".pr-outcome-select").forEach((sel) => {
      sel.addEventListener("change", async () => {
        const visitId = Number(sel.dataset.visitId);
        const errEl = content.querySelector(`.pr-outcome-error[data-visit-id="${visitId}"]`);
        const savedEl = content.querySelector(`.pr-outcome-saved[data-visit-id="${visitId}"]`);
        hideError(errEl);
        const newVal = sel.value || null;
        const { error } = await supabaseClient.from("visit_reports").update({ clinical_outcome_8h: newVal }).eq("id", visitId);
        if (error) {
          showError(errEl, friendlyErrorMessage(error));
          return;
        }
        const v = visits.find((r) => r.id === visitId);
        if (v) v.clinical_outcome_8h = newVal;
        prInvalidate("visitReports");
        savedEl.style.display = "inline";
        setTimeout(() => { savedEl.style.display = "none"; }, 2000);
      });
    });
  }

  function prVitalChartSvg(points) {
    if (points.length < 2) return `<p style="color:var(--text-muted);">אין מספיק נתונים לגרף.</p>`;
    const width = 560, height = 160, pad = 24;
    const values = points.map((p) => p.value);
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const stepX = (width - pad * 2) / (points.length - 1);
    const xy = (p, i) => [pad + i * stepX, height - pad - ((p.value - min) / range) * (height - pad * 2)];
    const coords = points.map((p, i) => xy(p, i).map((n) => n.toFixed(1)).join(",")).join(" ");
    const circles = points.map((p, i) => { const [x, y] = xy(p, i); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#2f7d6e" />`; }).join("");
    return `<svg viewBox="0 0 ${width} ${height}" style="width:100%; max-width:${width}px; height:${height}px;"><polyline points="${coords}" fill="none" stroke="#2f7d6e" stroke-width="2" />${circles}<text x="2" y="14" font-size="11" fill="#5b6a67">${max}</text><text x="2" y="${height - 6}" font-size="11" fill="#5b6a67">${min}</text></svg>`;
  }

  async function prRenderVitalsTab(content) {
    const visits = await prCached("visitReports", prFetchVisitReports);
    if (!visits.length) { content.innerHTML = `<div class="empty-state">אין עדיין מדידות למטופל זה</div>`; return; }
    const latest = visits[0];
    const latestHtml = VITALS_META.filter((v) => latest[v.key] != null).map((v) => `<div>${v.label}: <strong>${latest[v.key]}${v.unit}</strong></div>`).join("");
    const vitalsWithData = VITALS_META.filter((v) => visits.some((r) => r[v.key] != null));
    content.innerHTML = `
      <div class="pr-card"><h3>מדידה אחרונה (${formatDateHe(new Date(latest.visit_date))} ${formatTimeHe(new Date(latest.visit_date))})</h3>${latestHtml}</div>
      <div class="pr-card">
        <div class="field" style="max-width:260px;"><label for="pr-vitals-select">בחירת מדד לגרף</label>
          <select id="pr-vitals-select">${vitalsWithData.map((v) => `<option value="${v.key}">${v.label}</option>`).join("")}</select>
        </div>
        <div id="pr-vitals-chart"></div>
      </div>
    `;
    const renderChartFor = (key) => {
      const points = visits.filter((r) => r[key] != null).slice().sort((a, b) => new Date(a.visit_date) - new Date(b.visit_date)).map((r) => ({ value: r[key] }));
      document.getElementById("pr-vitals-chart").innerHTML = prVitalChartSvg(points);
    };
    const selectEl = document.getElementById("pr-vitals-select");
    if (vitalsWithData.length) {
      renderChartFor(vitalsWithData[0].key);
      selectEl.addEventListener("change", () => renderChartFor(selectEl.value));
    }
  }

  async function prRenderNotesTab(content) {

          <select id="pr-note-type">${Object.entries(NOTE_TYPE_LABELS).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>

  async function prRenderAppointmentsTab(content) {

      ${bookings.map((b) => `<tr><td>${formatDateHe(new Date(b.scheduled_at))} ${formatTimeHe(new Date(b.scheduled_at))}</td><td>${escapeHtml(b.medical_staff?.full_name || "—")}</td><td>${PURPOSE_LABELS[b.visit_purpose] || b.visit_purpose}</td><td>${STATUS_LABELS[b.status] || b.status}</td></tr>`).join("")}

  async function prAckAlert(alertId) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { error } = await supabaseClient.from("alerts").update({ status: "acknowledged", acknowledged_by: session?.user?.id || null, acknowledged_at: new Date().toISOString() }).eq("id", alertId);
    if (error) { flashError(friendlyErrorMessage(error)); return; }
    prInvalidate("alerts"); flashSuccess("ההתראה סומנה כטופלה"); prSwitchTab("alerts");
  }
  async function prResolveAlert(alertId) {
    const { error } = await supabaseClient.from("alerts").update({ status: "resolved" }).eq("id", alertId);
    if (error) { flashError(friendlyErrorMessage(error)); return; }
    prInvalidate("alerts"); flashSuccess("ההתראה נסגרה"); prSwitchTab("alerts");
  }
  async function prCreateTask(alertId) {
    const titleEl = alertId ? document.querySelector(`.pr-task-title[data-alert-id="${alertId}"]`) : document.getElementById("pr-general-task-title");
    const dueEl = alertId ? document.querySelector(`.pr-task-due[data-alert-id="${alertId}"]`) : document.getElementById("pr-general-task-due");
    const title = titleEl.value.trim();
    const due = dueEl.value;
    if (!title || !due) { flashError("יש להזין כותרת ותאריך/שעה למשימה"); return; }
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { error } = await supabaseClient.from("tasks").insert({
      patient_id: window.currentPatientState.patientId, alert_id: alertId, title,
      due_at: new Date(due).toISOString(), created_by: session?.user?.id || null,
    });
    if (error) { flashError(friendlyErrorMessage(error)); return; }
    prInvalidate("tasks"); flashSuccess("משימת המעקב נוצרה"); prSwitchTab("alerts");
  }
  async function prCompleteTask(taskId) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    const { error } = await supabaseClient.from("tasks").update({ status: "completed", completed_by: session?.user?.id || null, completed_at: new Date().toISOString() }).eq("id", taskId);
    if (error) { flashError(friendlyErrorMessage(error)); return; }
    prInvalidate("tasks"); flashSuccess("המשימה הושלמה"); prSwitchTab("alerts");
  }

  async function prRenderAlertsTab(content) {
    const [alerts, tasks] = await Promise.all([prCached("alerts", prFetchAlerts), prCached("tasks", prFetchTasks)]);
    const tasksByAlert = new Map();
    tasks.forEach((t) => {
      const key = t.alert_id || "none";
      if (!tasksByAlert.has(key)) tasksByAlert.set(key, []);
      tasksByAlert.get(key).push(t);
    });
    const alertsHtml = alerts.length ? alerts.map((a) => {
      const linkedTasks = tasksByAlert.get(a.id) || [];
      return `
      <div class="pr-card">
        <div class="section-header"><strong>${ALERT_TYPE_LABELS[a.alert_type] || a.alert_type}</strong><span class="pr-badge pr-badge-${a.severity}">${a.severity === "high" ? "גבוהה" : a.severity === "medium" ? "בינונית" : "נמוכה"}</span></div>
        <p style="margin:6px 0;">${escapeHtml(a.message)}</p>
        <div style="color:var(--text-muted); font-size:12px;">נוצר: ${formatDateHe(new Date(a.created_at))} ${formatTimeHe(new Date(a.created_at))} · <span class="pr-badge pr-badge-${a.status}">${a.status === "open" ? "פתוח" : a.status === "acknowledged" ? "טופל" : "נסגר"}</span></div>
        ${a.status !== "resolved" ? `<div class="actions-row" style="justify-content:flex-start; margin-top:8px; flex-wrap:wrap;">
          ${a.status === "open" ? `<button class="btn btn-secondary btn-sm pr-alert-ack" data-alert-id="${a.id}">אישור קבלה</button>` : ""}
          <button class="btn btn-ghost btn-sm pr-alert-resolve" data-alert-id="${a.id}">סגירה</button>
        </div>` : ""}
        ${linkedTasks.length ? `<div style="margin-top:8px; font-size:13px;">${linkedTasks.map((t) => `<div>${t.status === "completed" ? "✅" : new Date(t.due_at) < new Date() ? "⏰ באיחור —" : "🕓"} ${escapeHtml(t.title)} (${formatDateHe(new Date(t.due_at))} ${formatTimeHe(new Date(t.due_at))})</div>`).join("")}</div>` : ""}
        <div class="field" style="margin-top:8px;">
          <input type="text" class="pr-task-title" data-alert-id="${a.id}" placeholder="משימת מעקב">
          <input type="datetime-local" class="pr-task-due" data-alert-id="${a.id}" style="margin-top:4px; max-width:220px;">
          <button class="btn btn-secondary btn-sm pr-task-create" data-alert-id="${a.id}" style="margin-top:4px;">יצירת משימת מעקב</button>
        </div>
      </div>`;
    }).join("") : `<div class="empty-state">אין התראות</div>`;

    const generalTasks = tasksByAlert.get("none") || [];
    const nowTs = new Date();
    const overdue = generalTasks.filter((t) => t.status === "pending" && new Date(t.due_at) < nowTs);
    const upcoming = generalTasks.filter((t) => t.status === "pending" && new Date(t.due_at) >= nowTs);
    const completed = generalTasks.filter((t) => t.status === "completed");
    const taskRow = (t, overdueFlag) => `<div class="pr-card" style="display:flex; justify-content:space-between; align-items:center;">
      <span>${overdueFlag ? "⏰ " : ""}${escapeHtml(t.title)} — ${formatDateHe(new Date(t.due_at))} ${formatTimeHe(new Date(t.due_at))}</span>
      ${t.status === "pending" ? `<button class="btn btn-secondary btn-sm pr-task-complete" data-task-id="${t.id}">השלמה</button>` : `<span class="pr-badge pr-badge-resolved">הושלם</span>`}
    </div>`;

    content.innerHTML = `
      <h3>התראות</h3>${alertsHtml}
      <h3 style="margin-top:20px;">משימות מעקב כלליות</h3>
      <div class="field" style="max-width:420px;">
        <input type="text" id="pr-general-task-title" placeholder="משימה חדשה">
        <input type="datetime-local" id="pr-general-task-due" style="margin-top:4px;">
        <button class="btn btn-secondary btn-sm" id="pr-general-task-create" style="margin-top:4px;">הוספה</button>
      </div>
      ${overdue.length ? `<h4>באיחור</h4>${overdue.map((t) => taskRow(t, true)).join("")}` : ""}
      ${upcoming.length ? `<h4>ממתינות</h4>${upcoming.map((t) => taskRow(t, false)).join("")}` : ""}
      ${completed.length ? `<h4>הושלמו</h4>${completed.map((t) => taskRow(t, false)).join("")}` : ""}
      ${!overdue.length && !upcoming.length && !completed.length ? `<div class="empty-state">אין משימות מעקב</div>` : ""}
    `;
    content.querySelectorAll(".pr-alert-ack").forEach((btn) => btn.addEventListener("click", () => prAckAlert(Number(btn.dataset.alertId))));
    content.querySelectorAll(".pr-alert-resolve").forEach((btn) => btn.addEventListener("click", () => prResolveAlert(Number(btn.dataset.alertId))));
    content.querySelectorAll(".pr-task-create").forEach((btn) => btn.addEventListener("click", () => prCreateTask(Number(btn.dataset.alertId))));
    content.querySelectorAll(".pr-task-complete").forEach((btn) => btn.addEventListener("click", () => prCompleteTask(Number(btn.dataset.taskId))));
    const generalBtn = document.getElementById("pr-general-task-create");
    if (generalBtn) generalBtn.addEventListener("click", () => prCreateTask(null));
  }

  // ===== אתחול: הגנה על העמוד — לא מחובר/ת או לא איש-צוות פעיל => redirect להתחברות =====
  setupAllModalsAccessibility();
  window.onOfflineQueueFlushed = (count) => flashSuccess(`${count} דוחות ביקור שנשמרו במכשיר סונכרנו בהצלחה`);
  (async () => {
    const staff = await resolveActiveStaffSession();
    if (!staff) {
      window.location.href = "employee-login.html";
      return;
    }
    myStaffRow = staff;
    await showStaffApp();
    if (navigator.onLine) {
      const { synced } = await flushOfflineQueue();
      if (synced > 0) { flashSuccess(`${synced} דוחות ביקור שנשמרו במכשיר סונכרנו בהצלחה`); loadMyBookings(); }
    }
  })();
</script>
