name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests-js:
    name: JS unit tests (slot calculation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/unit/*.test.js

  unit-tests-py:
    name: Python unit tests (risk calculation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  # 3 מתוך 5 קבצי ה-E2E לא נוגעים ב-DB חי בכלל (מדמים את supabaseClient עם מוק) —
  # בטוחים לרוץ על כל push, ותופסים רגרסיה אמיתית (כבר קרה פעם אחת בשיחה הזו).
  e2e-safe:
    name: E2E (Playwright) — mocked, no live DB, runs on every push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/xss-escaping.spec.js tests/e2e/my-work-pagination.spec.js tests/e2e/booking-taken-slots.spec.js

  # שני הספקים הנותרים כן נוגעים ב-DB חי (יוצרים הזמנות/דוחות אמיתיים) — דורשים
  # פרויקט Supabase ייעודי לבדיקות (secrets: E2E_STAFF_EMAIL/E2E_STAFF_PASSWORD,
  # ו-public/config.js מצביע על אותו פרויקט בדיקה) — לא רצים אוטומטית בכוונה,
  # רק ידנית (workflow_dispatch) אחרי שהוגדרו ה-secrets ב-repo settings.
  e2e-live-db:
    name: E2E (Playwright) — booking.spec.js/visit-report.spec.js, manual trigger only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/booking.spec.js tests/e2e/visit-report.spec.js
