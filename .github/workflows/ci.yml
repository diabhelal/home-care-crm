name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# least privilege: the default GITHUB_TOKEN may only read repository contents
permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (whole history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every commit for credentials
        run: |
          set -euo pipefail
          pattern='sb_secret_[A-Za-z0-9_-]{10,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{10,}|(sk|rk)_(live|test)_[A-Za-z0-9]{16,}|eyJhbGciOi[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}'
          if git grep -I -n -E "$pattern" $(git rev-list --all) -- . ':!package-lock.json' | head -5 | grep .; then
            echo "Possible committed secret found (see above)"; exit 1
          fi
          echo "no credential patterns in history"

  docs-consistency:
    name: Documentation links and paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_docs.py

  unit-tests-js:
    name: JS unit tests (slot calculation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test tests/unit/*.test.js

  unit-tests-py:
    name: Python unit tests (risk calculation)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: predictive-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests/ -v

  # backend/ (FastAPI): בדיקות יחידה/שירות, ובדיקות DB על Postgres מקומי חד-פעמי
  # (ה-wheel pixeltable-pgserver, בלי Docker ובלי להתחבר לפרויקט Supabase). אין שום סוד:
  # הכול על נתונים סינתטיים, והמיגרציות האמיתיות מוחלות על ה-DB החד-פעמי בלבד.
  backend-tests:
    name: Backend tests (pytest) + isolated database tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: API and service tests
        run: python -m pytest -q --ignore=tests_db
      - name: Database tests (throwaway local Postgres)
        run: python -m pytest tests_db -q

  # Known-vulnerability check of the pinned runtime/dev dependencies (Python lock files + npm lockfile).
  # Fails on any known vulnerability; Dependabot opens the upgrade PRs.
  dependency-audit:
    name: Dependency vulnerability audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install pip-audit
      - name: pip-audit (lock files)
        run: |
          for f in backend/requirements.runtime.lock.txt backend/requirements.lock.txt predictive-service/requirements.lock.txt; do
            echo "== $f"; pip-audit -r "$f" --no-deps --disable-pip --progress-spinner off
          done
      - name: npm audit
        run: npm audit --audit-level=high

  # כל קבצי ה-E2E שאינם booking/visit-report לא נוגעים ב-DB חי בכלל (מדמים את
  # supabaseClient וה-backend עם מוק) - בטוחים לרוץ על כל push, ותופסים רגרסיה אמיתית.
  e2e-safe:
    name: E2E (Playwright) — mocked, no live DB, runs on every push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # every spec except the live-DB pair (booking/visit-report, manual job below) and the quarantined flaky
      # trend-forecast spec: a NEW spec is picked up automatically instead of being silently skipped.
      - name: Run all mocked specs
        run: |
          set -euo pipefail
          specs=$(ls tests/e2e/*.spec.js | grep -v -E '/(booking|visit-report|trend-forecast)\.spec\.js$')
          echo "$specs"
          npx playwright test $specs

  # שני הספקים הנותרים כן נוגעים ב-DB חי (יוצרים הזמנות/דוחות אמיתיים) — דורשים
  # פרויקט Supabase ייעודי לבדיקות (secrets: E2E_STAFF_EMAIL/E2E_STAFF_PASSWORD,
  # ו-public/config.js מצביע על אותו פרויקט בדיקה) — לא רצים אוטומטית בכוונה,
  # רק ידנית (workflow_dispatch) אחרי שהוגדרו ה-secrets ב-repo settings.
  e2e-live-db:
    name: E2E (Playwright) — booking.spec.js/visit-report.spec.js, manual trigger only
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      E2E_STAFF_EMAIL: ${{ secrets.E2E_STAFF_EMAIL }}
      E2E_STAFF_PASSWORD: ${{ secrets.E2E_STAFF_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/booking.spec.js tests/e2e/visit-report.spec.js
